# Runs the rule tests and builds the game on every push and pull request.
# The built game is kept for 30 days as a download on the run's page.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: cp dist/index.html Monomachia.html
      - uses: actions/upload-artifact@v7
        with:
          name: Monomachia
          path: Monomachia.html
          retention-days: 30
